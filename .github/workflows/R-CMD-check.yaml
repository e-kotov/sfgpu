name: R-CMD-check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (R release, CPU only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: "true"
      SFGPU_REQUIRE_CUDA: "false"
      SFGPU_REQUIRE_METAL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          dependencies: '"all"'
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'

  metal:
    name: macos-15 (R release, required Metal GPU)
    runs-on: macos-15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: "true"
      SFGPU_REQUIRE_CUDA: "false"
      SFGPU_REQUIRE_METAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          dependencies: '"all"'
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Install with Metal explicitly enabled
        run: |
          mkdir -p "$RUNNER_TEMP/sfgpu-metal-lib"
          echo "R_LIBS=$RUNNER_TEMP/sfgpu-metal-lib:$R_LIBS_USER" >> "$GITHUB_ENV"
          R CMD INSTALL --configure-args=--enable-metal --library="$RUNNER_TEMP/sfgpu-metal-lib" .
      - name: Run required Metal validation
        run: Rscript tools/validate-metal.R
      - name: Run required radius validation
        run: Rscript tools/validate-radius.R
      - name: Run required indexed Metal radius validation
        env:
          SFGPU_RADIUS_BACKEND: metal
        run: |
          Rscript tools/validate-radius-index.R
          Rscript tools/validate-metal-index-keys.R
      - name: Verify corrupted Metal index kernels are rejected
        run: bash tools/check-metal-index-mutation.sh
      - name: Verify corrupted radius filters are rejected
        run: bash tools/check-radius-mutation.sh
      - name: Verify corrupted shader is rejected
        run: bash tools/check-metal-mutation.sh
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--install-args=--configure-args=--enable-metal")'
          error-on: '"warning"'
